<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR.TIWAWAのホームページ</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .box { border: 2px solid #333; padding: 15px; margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>MR.TIWAWAのホームページ</h1>
    
    <div class="box">
        <h2>① フォントサイズ・拡大検証</h2>
        <p>スマートフォンの本体設定で文字サイズを変更したとき、この文字の大きさが変わるか、あるいは固定されているかを検証するための文章です。</p>
    </div>

    <div class="box">
        <h2>② スクロール・タップ検証</h2>
        <p>以下のボタンをタップしたときの反応や、ページを上下にスクロールしたときの挙動をテストできます。</p>
        <button onclick="alert('正しくタップされました！')">テストボタン</button>
    </div>
    <img src="yubinougoki-3.png" alt="虹色のスプレッドシート" style="width: 400%; max-width: none;">
</html>
